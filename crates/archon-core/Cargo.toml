[package]
name = "archon-core"
version = "0.0.0"
edition = "2021"
description = "CPU-bound compute kernels for Archon, compiled to WebAssembly."
license = "MIT"
publish = false

[lib]
# cdylib -> wasm artifact; rlib -> native unit tests / benches.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# parse_symbols (M1) uses a pure-Rust heuristic extractor, NOT tree-sitter:
# tree-sitter's C grammars do not link cleanly for wasm32-unknown-unknown via
# wasm-pack. Swapping in tree-sitter (or web-tree-sitter in the host) is a
# future upgrade tracked against ADR-0011.

[profile.release]
opt-level = 3      # compute core: optimize for speed (size is secondary)
lto = true
